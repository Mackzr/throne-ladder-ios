# A Capacitor app to TestFlight (first used for Listem, D19, Nov 2026). Like testflight.yml (Unity), the app arrives as
# app.zip on a DRAFT release of this repository (the app's publish script makes it); the run is started by hand
# (workflow_dispatch) with that tag. On GitHub's Mac: the App ID is registered if it's new, the Xcode project is archived
# unsigned, then signed for the App Store with the App Store Connect key (cloud signing) and uploaded.
# Secrets (shared with testflight.yml): ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID. The run number is the build number.
# Public repository: drafts are never visible, the draft and its tag are deleted once the build is uploaded, nothing is
# stored as an artifact, and secrets only travel through the environment (GitHub masks them in logs).
name: Capacitor TestFlight
run-name: TestFlight ${{ inputs.name }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag that holds app.zip
        required: true
      name:
        description: App name (for the App ID's description)
        required: true
      bundle:
        description: Bundle ID (registered here if it's new)
        required: true
      project:
        description: Xcode project inside app.zip
        required: false
        default: ios/App/App.xcodeproj
      scheme:
        description: Xcode scheme
        required: false
        default: App
      runner:
        description: GitHub Mac to build on
        required: false
      only_app_id:
        description: "Only register the App ID (a new app's first step: App Store Connect's New App form lists registered IDs)"
        type: boolean
        required: false
        default: false
permissions:
  contents: write       # (to read the draft release, and delete it once the build is uploaded)
defaults:
  run:
    shell: bash
jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      TEAM_ID: K955P6369G
    steps:
      - uses: actions/checkout@v4
      # App Store Connect takes only apps built with the iOS 26 SDK or later (Xcode 26).
      - name: Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$x" ] || { echo "no Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Fetch the app
        if: ${{ !inputs.only_app_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -p app.zip -R "$GITHUB_REPOSITORY"
          unzip -q app.zip -d app
          rm app.zip
          [ -d "app/${{ inputs.project }}" ] || { echo "no ${{ inputs.project }} in app.zip"; exit 1; }
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: App ID
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # The entitlements file (if the app has one) says which capabilities the App ID needs switched on.
        run: node asc-bundle-id.mjs "${{ inputs.bundle }}" "${{ inputs.name }}" $(find app -name "*.entitlements" -not -path "*/node_modules/*" 2>/dev/null | head -1)
      # Archived unsigned (automatic signing here wants a development profile, which needs a registered iPhone); the export
      # signs it once for the App Store. Swift packages (Capacitor) resolve from GitHub and from app.zip's node_modules.
      - name: Archive
        if: ${{ !inputs.only_app_id }}
        run: |
          xcodebuild -project "app/${{ inputs.project }}" -scheme "${{ inputs.scheme }}" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E -B3 -A30 "error:|BUILD FAILED|Undefined symbols|ld: " "$RUNNER_TEMP/archive.log" | head -200; tail -40 "$RUNNER_TEMP/archive.log"; exit 1; }
          echo "archived (build ${{ github.run_number }})"
      - name: Sign and upload to TestFlight
        if: ${{ !inputs.only_app_id }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the build from this repository
        if: ${{ success() && !inputs.only_app_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1
